uple[conint(ge=0, le=4), conint(ge=0, le=4)] = Field(\n        default=(0, 3)\n    )\n    int_range_slider_disabled: tuple[conint(ge=0, le=4), conint(ge=0, le=4)] = Field(\n        default=(0, 3), json_schema_extra=dict(json_schema_extra=dict(disabled=True))\n    )\n    float_slider: float = Field(default=2.2, ge=1, le=3)\n    float_text: float = 2.2\n    float_text_with_unit: float = Field(default=2.2, json_schema_extra=dict(unit=\"mm\"))\n    float_text_locked: float = Field(default=2.2, json_schema_extra=dict(disabled=True))\n    float_range_slider: tuple[confloat(ge=0, le=4), confloat(ge=0, le=4)] = Field(\n        default=(0, 2.2)\n    )\n    checkbox: bool = Field(\n        default=True, title=\"boolean checkbox\", description=\"a checkbox\"\n    )\n    dropdown: ty.Optional[FruitEnum] = None\n    dropdown_int: Number = Field(default=Number.ONE)  #\n    dropdown_int_optional: ty.Optional[Number] = Field(default=Number.ONE)  #\n    combobox: str = Field(\"apple\", examples=FruitEnum._member_names_)\n    combobox1: ty.Union[str, FruitEnum] = Field(\"apple\")  # TODO: make this work\n    dropdown_edge_case: FruitEnum = Field(\n        title=\"dropdwon FruitEnum with metadata\",\n        default=FruitEnum.apple,\n        description=\"updated description\",\n    )\n    dropdown_simple: str = Field(\n        default=\"asd\", json_schema_extra=dict(enum=[\"asd\", \"asdf\"])\n    )\n    text: str = Field(default=\"adsf\", description=\"a description about my string\")\n    text_short: Annotated[str, StringConstraints(min_length=0, max_length=20)] = (\n        \"short text\"\n    )\n    textarea: Annotated[str, StringConstraints(min_length=0, max_length=800)] = Field(\n        \"long text \" * 50, description=\"long text field\"\n    )\n    select_multiple: ty.List[FruitEnum] = Field(\n        (FruitEnum.apple,), description=\"a short select multiple list\"\n    )\n    select_multiple_nullable: ty.Optional[ty.List[FruitEnum]] = Field(\n        None, description=\"a short nullable select multiple list\"\n    )\n    tags_input: ty.List[LongEnum] = Field(\n        (LongEnum.a,), description=\"a long select multiple list\"\n    )\n    tags_input_nullable: ty.Optional[ty.List[LongEnum]] = Field(\n        (LongEnum.a,), description=\"a long nullable select multiple list\"\n    )\n\n    model_config = ConfigDict(json_schema_extra=dict(show_raw=True))\n\n```","text/plain":"<IPython.core.display.Markdown object>"},"metadata":{},"output_type":"display_data"}],"tabbable":null,"tooltip":null}},"cacaa941b60a44cdb8d57c33486c44a3":{"model_module":"@jupyter-widgets/base","model_module_version":"2.0.0","model_name":"LayoutModel","state":{"_model_module":"@jupyter-widgets/base","_model_module_version":"2.0.0","_model_name":"LayoutModel","_view_count":null,"_view_module":"@jupyter-widgets/base","_view_module_version":"2.0.0","_view_name":"LayoutView","align_content":null,"align_items":null,"align_self":null,"border_bottom":null,"border_left":null,"border_right":null,"border_top":null,"bottom":null,"display":null,"flex":null,"flex_flow":null,"grid_area":null,"grid_auto_columns":null,"grid_auto_flow":null,"grid_auto_rows":null,"grid_column":null,"grid_gap":null,"grid_row":null,"grid_template_areas":null,"grid_template_columns":null,"grid_template_rows":null,"height":null,"justify_content":null,"justify_items":null,"left":null,"margin":null,"max_height":null,"max_width":null,"min_height":null,"min_width":null,"object_fit":null,"object_position":null,"order":null,"overflow":null,"padding":null,"right":null,"top":null,"visibility":null,"width":null}},"cad6088cb65141ae87dc8d322ff3aab6":{"model_module":"@jupyter-widgets/controls","model_module_version":"2.0.0","model_name":"HTMLModel","state":{"_dom_classes":[],"_model_module":"@jupyter-widgets/controls","_model_module_version":"2.0.0","_model_name":"HTMLModel","_view_count":null,"_view_module":"@jupyter-widgets/controls","_view_module_version":"2.0.0","_view_name":"HTMLView","description":"","descriptio       stripColumnClz(note)

              div.style.top = top - 2 + "px";
              div.style.height = height + 4 + "px";
              div.style.left = 0;
              let gutterDiv = window.document.getElementById("code-annotation-line-highlight-gutter");
              if (gutterDiv === null) {
                gutterDiv = window.document.createElement("div");
                gutterDiv.setAttribute("id", "code-annotation-line-highlight-gutter");
                gutterDiv.style.position = 'absolute';
                const codeCell = window.document.getElementById(targetCell);
                const gutter = codeCell.querySelector('.code-annotation-gutter');
                gutter.appendChild(gutterDiv);
              }
              gutterDiv.style.top = top - 2 + "px";
              gutterDiv.style.height = height + 4 + "px";
            }
            selectedAnnoteEl = annoteEl;
          }
        };
        const unselectCodeLines = () => {
          const elementsIds = ["code-annotation-line-highlight", "code-annotation-line-highlight-gutter"];
          elementsIds.forEach((elId) => {
            const div = window.document.getElementById(elId);
            if (div) {
              div.remove();
            }
          });
          selectedAnnoteEl = undefined;
        };
          // Handle positioning of the toggle
      window.addEventListener(
        "resize",
        throttle(() => {
          elRect = undefined;
          if (selectedAnnoteEl) {
            selectCodeLines(selectedAnnoteEl);
          }
        }, 10)
      );
      function throttle(fn, ms) {
      let throttle = false;
      let timer;
        return (...args) => {
          if(!throttle) { // first call gets through
              fn.apply(this, args);
              throttle = true;
          } else { // all the others get throttled
              if(timer) clearTimeout(timer); // cancel #2
              timer = setTimeout(() => {
                fn.apply(this, args);
                timer = throttle = false;
              }, ms);
          }
        };
      }
        // Attach click handler to the DT
        const annoteDls = window.document.querySelectorAll('dt[data-target-cell]');
        for (const annoteDlNode of annoteDls) {
          annoteDlNode.addEventListener('click', (event) => {
            const clickedEl = event.target;
            if (clickedEl !== selectedAnnoteEl) {
              unselectCodeLines();
              const activeEl = window.document.querySelector('dt[data-target-cell].code-annotation-active');
              if (activeEl) {
                activeEl.classList.remove('code-annotation-active');
              }
              selectCodeLines(clickedEl);
              clickedEl.classList.add('code-annotation-active');
            } else {
              // Unselect the line
              unselectCodeLines();
              clickedEl.classList.remove('code-annotation-active');
            }
          });
        }
    const findCites = (el) => {
      const parentEl = el.parentElement;
      if (parentEl) {
        const cites = parentEl.dataset.cites;
        if (cites) {
          return {
            el,
            cites: cites.split(' ')
          };
        } else {
          return findCites(el.parentElement)
        }
      } else {
        return undefined;
      }
    };
    var bibliorefs = window.document.querySelectorAll('a[role="doc-biblioref"]');
    for (var i=0; i<bibliorefs.length; i++) {
      const ref = bibliorefs[i];
      const citeInfo = findCites(ref);
      if (citeInfo) {
        tippyHover(citeInfo.el, function() {
          var popup = window.document.createElement('div');
          citeInfo.cites.forEach(function(cite) {
            var citeDiv = window.document.createElement('div');
            citeDiv.classList.add('hanging-indent');
            citeDiv.classList.add('csl-entry');
            var biblioDiv = window.document.getElementById('ref-' + cite);
            if (biblioDiv) {
              citeDiv.innerHTML = biblioDiv.innerHTML;
            }
            popup.appendChild(citeDiv);
          });
          return popup.innerHTML;
        });
      }
    }
  });
  </script>
